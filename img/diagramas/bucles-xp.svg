<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Bucles de retroalimentación de XP</title>
  <desc id="d">Círculos concéntricos: por fuera el plan de entregas (meses), luego el plan de iteración (semanas), las pruebas de aceptación (días), la reunión de pie (un día), las pruebas unitarias con TDD (minutos) y en el centro el código escrito en pares (segundos).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#51607a"/>
    </marker>
    <marker id="arrowAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b07a0c"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="18" fill="#f4f7fb"/>
  <circle cx="212" cy="212" r="192" fill="#dce7fb" stroke="#ffffff" stroke-width="2"/>
  <text x="212" y="39" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">meses</text>
  <circle cx="212" cy="212" r="162" fill="#bcd0f6" stroke="#ffffff" stroke-width="2"/>
  <text x="212" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">semanas</text>
  <circle cx="212" cy="212" r="132" fill="#93b2ee" stroke="#ffffff" stroke-width="2"/>
  <text x="212" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">días</text>
  <circle cx="212" cy="212" r="102" fill="#6a93e4" stroke="#ffffff" stroke-width="2"/>
  <text x="212" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">un día</text>
  <circle cx="212" cy="212" r="72" fill="#1f4fd1" stroke="#ffffff" stroke-width="2"/>
  <text x="212" y="159" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">minutos</text>
  <circle cx="212" cy="212" r="42" fill="#0b1b33"/>
  <text x="212" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Código</text>
  <text x="212" y="226" text-anchor="middle" font-size="11" font-weight="400" fill="#c7d6f2">segundos</text>
  <text x="430" y="60" text-anchor="start" font-size="14" font-weight="700" fill="#0b1b33">Bucles de retroalimentación</text>
  <text x="430" y="78" text-anchor="start" font-size="11" font-weight="400" fill="#51607a">Cuanto más adentro, más rápido el aviso</text>
  <circle cx="442" cy="110" r="10" fill="#dce7fb" stroke="#d6dfec"/>
  <text x="462" y="108" text-anchor="start" font-size="13" font-weight="700" fill="#0b1b33">Plan de entregas</text>
  <text x="462" y="124" text-anchor="start" font-size="11" font-weight="400" fill="#51607a">meses</text>
  <circle cx="442" cy="154" r="10" fill="#bcd0f6" stroke="#d6dfec"/>
  <text x="462" y="152" text-anchor="start" font-size="13" font-weight="700" fill="#0b1b33">Plan de iteración</text>
  <text x="462" y="168" text-anchor="start" font-size="11" font-weight="400" fill="#51607a">semanas</text>
  <circle cx="442" cy="198" r="10" fill="#93b2ee" stroke="#d6dfec"/>
  <text x="462" y="196" text-anchor="start" font-size="13" font-weight="700" fill="#0b1b33">Pruebas de aceptación</text>
  <text x="462" y="212" text-anchor="start" font-size="11" font-weight="400" fill="#51607a">días</text>
  <circle cx="442" cy="242" r="10" fill="#6a93e4" stroke="#d6dfec"/>
  <text x="462" y="240" text-anchor="start" font-size="13" font-weight="700" fill="#0b1b33">Reunión de pie</text>
  <text x="462" y="256" text-anchor="start" font-size="11" font-weight="400" fill="#51607a">un día</text>
  <circle cx="442" cy="286" r="10" fill="#1f4fd1" stroke="#d6dfec"/>
  <text x="462" y="284" text-anchor="start" font-size="13" font-weight="700" fill="#0b1b33">Pruebas unitarias (TDD)</text>
  <text x="462" y="300" text-anchor="start" font-size="11" font-weight="400" fill="#51607a">minutos</text>
  <circle cx="442" cy="330" r="10" fill="#0b1b33" stroke="#d6dfec"/>
  <text x="462" y="328" text-anchor="start" font-size="13" font-weight="700" fill="#0b1b33">Programación en pares</text>
  <text x="462" y="344" text-anchor="start" font-size="11" font-weight="400" fill="#51607a">segundos</text>

</svg>
