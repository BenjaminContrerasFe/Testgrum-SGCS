<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Modelo en cascada</title>
  <desc id="d">Seis etapas en escalera descendente: requisitos, diseño, implementación, pruebas, despliegue y mantenimiento. Una flecha punteada muestra que volver de pruebas a diseño es costoso.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#51607a"/>
    </marker>
    <marker id="arrowAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b07a0c"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="18" fill="#f4f7fb"/>
  <rect x="24" y="24" width="180" height="44" rx="10" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="114.0" y="51.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1b33">1. Requisitos</text>
  <path d="M204,46 H229 V81" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="106" y="84" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="196.0" y="111.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1b33">2. Diseño</text>
  <path d="M286,106 H311 V141" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="188" y="144" width="180" height="44" rx="10" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="278.0" y="171.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1b33">3. Implementación</text>
  <path d="M368,166 H393 V201" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="270" y="204" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="360.0" y="231.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1b33">4. Pruebas</text>
  <path d="M450,226 H475 V261" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="352" y="264" width="180" height="44" rx="10" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="442.0" y="291.0" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1b33">5. Despliegue</text>
  <path d="M532,286 H557 V321" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="434" y="324" width="180" height="44" rx="10" fill="#0b1b33" stroke="#0b1b33" stroke-width="1.5"/>
  <text x="524.0" y="351.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6. Mantenimiento</text>
  <path d="M270,226 H146 V132" fill="none" stroke="#b07a0c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAcc)"/>
  <text x="36" y="254" text-anchor="start" font-size="11" font-weight="600" fill="#7a5207" font-style="italic">Volver atrás: posible, pero costoso</text>
  <text x="24" y="400" text-anchor="start" font-size="12" font-weight="400" fill="#51607a">Cada etapa empieza cuando la anterior terminó y fue aprobada.</text>

</svg>
