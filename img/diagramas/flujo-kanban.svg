<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Flujo de un tablero Kanban</title>
  <desc id="d">Tablero con cuatro columnas: Por hacer, En proceso con límite de 3 tarjetas (llena), En pruebas con límite de 2 y un lugar libre, y Hecho. Una flecha muestra que una tarjeta se tira de En proceso a En pruebas cuando se libera lugar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#51607a"/>
    </marker>
    <marker id="arrowAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b07a0c"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="18" fill="#f4f7fb"/>
  <text x="24" y="34" text-anchor="start" font-size="12" font-weight="400" fill="#51607a">El trabajo avanza de izquierda a derecha y solo entra a una columna si hay lugar</text>
