  <rect x="170" y="52" width="146" height="42" rx="12" fill="#0b1b33"/>
  <rect x="170" y="80" width="146" height="14" fill="#0b1b33"/>
  <text x="182" y="79" text-anchor="start" font-size="12.5" font-weight="700" fill="#ffffff">En proceso</text>
  <rect x="266" y="62" width="42" height="22" rx="11" fill="#f6b93b"/>
  <text x="287" y="77" text-anchor="middle" font-size="10" font-weight="700" fill="#0b1b33">WIP 3</text>
  <rect x="182" y="106" width="122" height="40" rx="8" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1"/>
