  <text x="498" y="235" text-anchor="start" font-size="12" font-weight="600" fill="#0b1b33">Filtros</text>
  <path d="M292,270 C 330,250 330,180 344,146" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="325" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4fd1">Se “tira” la tarjeta</text>
  <text x="325" y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#1f4fd1">cuando se libera lugar</text>
  <path d="M30,378 H610" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="24" y="404" text-anchor="start" font-size="12" font-weight="400" fill="#51607a">Flujo de trabajo: medimos cuánto tarda cada tarjeta en llegar a “Hecho” (tiempo de ciclo).</text>

</svg>
