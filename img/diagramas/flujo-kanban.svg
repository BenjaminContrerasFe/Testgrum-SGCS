  <text x="498" y="131" text-anchor="start" font-size="12" font-weight="600" fill="#0b1b33">Menú</text>
  <rect x="486" y="158" width="122" height="40" rx="8" fill="#e4f4ec" stroke="#136f4e" stroke-width="1"/>
  <text x="498" y="183" text-anchor="start" font-size="12" font-weight="600" fill="#0b1b33">Inicio</text>
