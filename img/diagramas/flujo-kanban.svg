  <rect x="30" y="106" width="122" height="40" rx="8" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1"/>
  <text x="42" y="131" text-anchor="start" font-size="12" font-weight="600" fill="#0b1b33">Glosario A–Z</text>
  <rect x="30" y="158" width="122" height="40" rx="8" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1"/>
  <text x="42" y="183" text-anchor="start" font-size="12" font-weight="600" fill="#0b1b33">Formulario</text>
  <rect x="30" y="210" width="122" height="40" rx="8" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1"/>
