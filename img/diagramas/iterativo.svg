<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Modelo iterativo e incremental</title>
  <desc id="d">Un ciclo de planificar, construir, probar y evaluar. A la derecha, tres iteraciones donde el producto crece de un bloque (pedidos) a dos (pagos) y tres (seguimiento).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#51607a"/>
    </marker>
    <marker id="arrowAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b07a0c"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="18" fill="#f4f7fb"/>
  <circle cx="175" cy="205" r="100" fill="none" stroke="#d6dfec" stroke-width="10"/>
  <path d="M221.9,116.7 A100,100 0 0 1 263.3,158.1" fill="none" stroke="#1f4fd1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M263.3,251.9 A100,100 0 0 1 221.9,293.3" fill="none" stroke="#1f4fd1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M128.1,293.3 A100,100 0 0 1 86.7,251.9" fill="none" stroke="#1f4fd1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M86.7,158.1 A100,100 0 0 1 128.1,116.7" fill="none" stroke="#1f4fd1" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="127.0" y="88.0" width="96" height="34" rx="17" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="175.0" y="110.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1b33">Planificar</text>
  <rect x="227.0" y="188.0" width="96" height="34" rx="17" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="275.0" y="210.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1b33">Construir</text>
  <rect x="127.0" y="288.0" width="96" height="34" rx="17" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="175.0" y="310.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1b33">Probar</text>
  <rect x="27.0" y="188.0" width="96" height="34" rx="17" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="75.0" y="210.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1b33">Evaluar</text>
  <text x="175" y="201" text-anchor="middle" font-size="13" font-weight="400" fill="#51607a">Una</text>
  <text x="175" y="219" text-anchor="middle" font-size="13" font-weight="400" fill="#51607a">iteración</text>
  <path d="M327,205 H352" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="492" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1b33">En cada vuelta el producto crece</text>
  <rect x="362" y="280" width="80" height="48" rx="10" fill="#1f4fd1" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="402.0" y="309.0" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Pedidos</text>
  <text x="402" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">Iteración 1</text>
  <rect x="450" y="280" width="80" height="48" rx="10" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="490.0" y="309.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">Pedidos</text>
  <rect x="450" y="226" width="80" height="48" rx="10" fill="#1f4fd1" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="490.0" y="255.0" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Pagos</text>
  <text x="490" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">Iteración 2</text>
  <rect x="538" y="280" width="80" height="48" rx="10" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="578.0" y="309.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">Pedidos</text>
  <rect x="538" y="226" width="80" height="48" rx="10" fill="#dce7fb" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="578.0" y="255.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">Pagos</text>
  <rect x="538" y="172" width="80" height="48" rx="10" fill="#1f4fd1" stroke="#1f4fd1" stroke-width="1.5"/>
  <text x="578.0" y="201.0" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Seguimiento</text>
  <text x="578" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1b33">Iteración 3</text>
  <line x1="356" y1="336" x2="620" y2="336" stroke="#d6dfec" stroke-width="2"/>
  <text x="24" y="400" text-anchor="start" font-size="12" font-weight="400" fill="#51607a">Iterativo: el ciclo se repite. Incremental: cada vuelta suma una parte que funciona.</text>

</svg>
