<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Ciclo de un Sprint de Scrum</title>
  <desc id="d">Del Product Backlog se seleccionan elementos en la Sprint Planning y forman el Sprint Backlog. El Sprint dura de 1 a 4 semanas con una Daily cada 24 horas. Produce un Incremento terminado que se muestra en la Sprint Review; la Retrospectiva genera mejoras que vuelven al próximo sprint.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd1"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#51607a"/>
    </marker>
    <marker id="arrowAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b07a0c"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="18" fill="#f4f7fb"/>
  <rect x="34" y="148" width="92" height="92" rx="8" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <rect x="28" y="154" width="92" height="92" rx="8" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <rect x="22" y="160" width="92" height="92" rx="8" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <line x1="34" y1="178" x2="100" y2="178" stroke="#d6dfec" stroke-width="5" stroke-linecap="round"/>
  <line x1="34" y1="194" x2="100" y2="194" stroke="#d6dfec" stroke-width="5" stroke-linecap="round"/>
  <line x1="34" y1="210" x2="100" y2="210" stroke="#d6dfec" stroke-width="5" stroke-linecap="round"/>
  <line x1="34" y1="226" x2="100" y2="226" stroke="#d6dfec" stroke-width="5" stroke-linecap="round"/>
  <text x="68.0" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1b33">Product</text>
  <text x="68.0" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#51607a">Backlog</text>
  <rect x="176" y="169" width="72" height="76" rx="8" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <rect x="170" y="175" width="72" height="76" rx="8" fill="#ffffff" stroke="#1f4fd1" stroke-width="1.5"/>
  <line x1="182" y1="193" x2="228" y2="193" stroke="#d6dfec" stroke-width="5" stroke-linecap="round"/>
  <line x1="182" y1="209" x2="228" y2="209" stroke="#d6dfec" stroke-width="5" stroke-linecap="round"/>
  <line x1="182" y1="225" x2="228" y2="225" stroke="#d6dfec" stroke-width="5" stroke-linecap="round"/>
  <line x1="182" y1="241" x2="228" y2="241" stroke="#d6dfec" stroke-width="5" stroke-linecap="round"/>
  <text x="206.0" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1b33">Sprint</text>
  <text x="206.0" y="289" text-anchor="middle" font-size="11" font-weight="400" fill="#51607a">Backlog</text>
  <path d="M126,205 H164" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="142" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4fd1">Sprint</text>
  <text x="142" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4fd1">Planning</text>
  <path d="M256,205 H282" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="380" cy="205" r="92" fill="#dce7fb" stroke="#1f4fd1" stroke-width="3"/>
  <circle cx="380" cy="113" r="30" fill="#0b1b33"/>
  <text x="380" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Daily</text>
  <text x="380" y="126" text-anchor="middle" font-size="11" font-weight="400" fill="#c7d6f2">24 h</text>
  <text x="380" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1b33">Sprint</text>
  <text x="380" y="227" text-anchor="middle" font-size="12" font-weight="400" fill="#51607a">1 a 4 semanas</text>
  <path d="M478,205 H508" fill="none" stroke="#1f4fd1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="512" y="178" width="110" height="54" rx="10" fill="#0b1b33" stroke="#0b1b33" stroke-width="1.5"/>
  <text x="567.0" y="202.0" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Incremento</text>
  <text x="567.0" y="219.0" text-anchor="middle" font-size="11" fill="#ffffff">terminado (DoD)</text>
  <rect x="500" y="300" width="122" height="40" rx="20" fill="#ffffff" stroke="#136f4e" stroke-width="1.5"/>
  <text x="561.0" y="325.0" text-anchor="middle" font-size="13" font-weight="700" fill="#136f4e">Sprint Review</text>
  <path d="M567,234 V294" fill="none" stroke="#136f4e" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <rect x="300" y="300" width="160" height="40" rx="20" fill="#ffffff" stroke="#b07a0c" stroke-width="1.5"/>
  <text x="380.0" y="325.0" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5207">Retrospectiva</text>
  <path d="M496,320 H466" fill="none" stroke="#51607a" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <path d="M300,320 H236 V260" fill="none" stroke="#b07a0c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowAcc)"/>
  <text x="212" y="350" text-anchor="start" font-size="11" font-weight="600" fill="#7a5207" font-style="italic">Las mejoras entran al próximo sprint</text>
  <text x="24" y="400" text-anchor="start" font-size="12" font-weight="400" fill="#51607a">El Product Owner ordena el Product Backlog; los Developers eligen qué entra al sprint.</text>

</svg>
